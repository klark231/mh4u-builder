name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ZIG_VERSION: "0.13.0"  # keep in sync with build_game.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch zig (aarch64)
        run: |
          set -e
          pip download "ziglang==$ZIG_VERSION" --no-deps --only-binary=:all: \
            --platform manylinux_2_17_aarch64 --platform manylinux2014_aarch64 --platform musllinux_1_1_aarch64 -d wheel
          mkdir zig && unzip -q wheel/*.whl -d zig
          file zig/ziglang/zig
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          cp zig/ziglang/zig app/src/main/jniLibs/arm64-v8a/libzig.so
          cd zig/ziglang/lib
          # not needed for aarch64-linux-android -nostdlib
          rm -rf libc/mingw libc/wasi docs
          find libc/include -maxdepth 1 \( -name '*windows*' -o -name '*macos*' -o -name '*wasm*' -o -name '*wasi*' \) -exec rm -rf {} +
          zip -qr -9 "$GITHUB_WORKSPACE/app/src/main/assets/ziglib.zip" .
          du -sh "$GITHUB_WORKSPACE/app/src/main/assets/ziglib.zip"

      - name: Sanity check trimmed zig lib
        run: |
          set -e
          pip install "ziglang==$ZIG_VERSION"
          export ZIG_LIB_DIR="$PWD/zig/ziglang/lib" ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zc" ZIG_LOCAL_CACHE_DIR="$RUNNER_TEMP/zc"
          R=mh4n/tools/recomp/runtime
          echo 'int x;' > "$RUNNER_TEMP/empty.c"
          python -m ziglang cc -fno-sanitize=undefined -g0 -target aarch64-linux-android -shared -nostdlib \
            -Wl,-soname,libc.so "$RUNNER_TEMP/empty.c" -o "$RUNNER_TEMP/libc.so"
          python -m ziglang cc -fno-sanitize=undefined -g0 -target aarch64-linux-android -nostdlibinc -isystem $R/android \
            -O1 -fPIC -c $R/rc_dll.c -I $R -o "$RUNNER_TEMP/rc_dll.o" || true

      - name: Pack tools
        run: |
          set -e
          python mh4n/tools/build_game.py --print-id | tee app/src/main/assets/code_library_id.txt
          (cd mh4n && zip -qr -9 "$GITHUB_WORKSPACE/app/src/main/assets/mh4n.zip" tools config -x '*__pycache__*')

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 not set, using debug key"
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk "out/mh4u-builder-$(cat VERSION)-${GITHUB_RUN_NUMBER}.apk"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: mh4u-builder-apk
          path: out/*.apk

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${GITHUB_RUN_NUMBER}" out/*.apk --title "build ${GITHUB_RUN_NUMBER}" --notes "tools $(cat VERSION), lib id $(cat app/src/main/assets/code_library_id.txt)"
